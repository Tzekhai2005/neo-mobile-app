name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # Copy the latest web UI into flutter assets before building
      - name: Sync Web UI into Flutter Assets
        run: |
          mkdir -p flutter_app/assets
          cp stage_companion/web/index.html flutter_app/assets/index.html
          echo "✓ Synced web UI ($(wc -c < flutter_app/assets/index.html) bytes)"

      # Generate Android Gradle scaffolding (safe to re-run)
      - name: Generate Android Scaffolding
        working-directory: ./flutter_app
        run: flutter create --platforms=android --org com.aightech .

      - name: Install Dependencies
        working-directory: ./flutter_app
        run: flutter pub get

      - name: Build Android APK
        working-directory: ./flutter_app
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: neo-companion-android-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
