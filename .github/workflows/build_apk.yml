name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Android Scaffolding
        working-directory: ./flutter_app
        run: flutter create --platforms=android --org com.aightech .

      - name: Install Dependencies
        working-directory: ./flutter_app
        run: flutter pub get

      - name: Run protocol tests
        working-directory: ./flutter_app
        run: flutter test test/protocol_test.dart test/messages_test.dart test/data_test.dart test/live_signal_buffer_test.dart test/report_test.dart test/report_pdf_test.dart test/report_exporter_test.dart test/device_status_test.dart test/app_services_test.dart test/dataset_library_test.dart test/signal_loss_test.dart test/report_days_test.dart test/format_test.dart test/live_trace_test.dart test/home_page_test.dart test/trace_math_test.dart test/trace_sources_test.dart test/signal_lanes_test.dart test/activity_risk_test.dart test/data_view_controller_test.dart test/data_page_test.dart test/app_entry_test.dart

      - name: Build Android APK
        working-directory: ./flutter_app
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: neo-companion-android-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
