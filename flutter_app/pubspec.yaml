name: neo_companion
description: "Neo Ear-EEG Clinical Companion — standalone hardware direct mode"
publish_to: "none"
version: 2.1.0+3

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  pdf: ^3.11.0
  path_provider: ^2.1.0
  share_plus: ^13.0.0
  archive: ^4.0.0
  file_picker: ^13.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/demo_recording/
    - assets/fonts/
    - assets/brand/
